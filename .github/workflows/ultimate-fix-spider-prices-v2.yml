name: Ultimate fix Spider prices v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/ultimate-fix-spider-prices-v2.mjs"
      - ".github/workflows/ultimate-fix-spider-prices-v2.yml"

permissions:
  contents: write

concurrency:
  group: ultimate-fix-spider-prices-v2
  cancel-in-progress: true

jobs:
  ultimate-fix-spider-prices-v2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check script
        run: node --check scripts/ultimate-fix-spider-prices-v2.mjs

      - name: Fix Spider prices v2
        run: node scripts/ultimate-fix-spider-prices-v2.mjs

      - name: Commit Spider price fix v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html public/index_phone.html scripts/ultimate-fix-spider-prices-v2.mjs .github/workflows/ultimate-fix-spider-prices-v2.yml

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Fix Spider T777 and T666 prices v2"
            git push
          else
            echo "No changes to commit."
          fi
