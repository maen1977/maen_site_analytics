name: Final cleanup Spider devices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-cleanup-spider-devices
  cancel-in-progress: true

jobs:
  final-cleanup-spider-devices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check files
        run: |
          node --check scripts/final-cleanup-spider-devices.mjs
          node --check public/assets/spider-devices-final-guard.js

      - name: Clean pages and install final guard
        run: node scripts/final-cleanup-spider-devices.mjs

      - name: Commit final Spider cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/index_phone.html public/assets/spider-devices-final-guard.js scripts/final-cleanup-spider-devices.mjs .github/workflows/final-cleanup-spider-devices.yml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Final cleanup for Spider device cards"
            git push
          else
            echo "No changes to commit."
          fi
