name: Daily Football News Update

on:
  schedule:
    # Once every 24 hours; 05:35 UTC is about 08:35 in Jordan when UTC+3 applies.
    - cron: '35 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: daily-football-news-update
  cancel-in-progress: false

jobs:
  update-football-news:
    name: Fetch and publish Arabic and English football news
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify Node runtime
        run: node --version

      - name: Check football updaters and validators
        run: |
          node --check scripts/update-sports-news.mjs
          node --check scripts/update-sports-news-en.mjs
          node --check scripts/update-football-matches.mjs
          node --check scripts/test-sports-news.mjs
          node --check scripts/test-sports-news-en.mjs
          node --check scripts/test-football-matches.mjs

      - name: Update Arabic football news
        id: arabic
        continue-on-error: true
        run: npm run github:update-sports

      - name: Update English football news
        id: english
        continue-on-error: true
        run: npm run github:update-sports-en

      - name: Update football matches
        id: matches
        continue-on-error: true
        run: npm run github:update-matches

      - name: Validate Arabic and English news datasets
        id: validateNews
        if: ${{ always() && steps.arabic.outcome == 'success' && steps.english.outcome == 'success' }}
        continue-on-error: true
        run: |
          node scripts/test-sports-news.mjs
          node scripts/test-sports-news-en.mjs

      - name: Validate football match dataset
        id: validateMatches
        if: ${{ always() && steps.matches.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/test-football-matches.mjs

      - name: Write football workflow status
        if: ${{ always() }}
        env:
          ARABIC_OUTCOME: ${{ steps.arabic.outcome }}
          ENGLISH_OUTCOME: ${{ steps.english.outcome }}
          MATCHES_OUTCOME: ${{ steps.matches.outcome }}
          NEWS_VALIDATE_OUTCOME: ${{ steps.validateNews.outcome }}
          MATCHES_VALIDATE_OUTCOME: ${{ steps.validateMatches.outcome }}
        run: |
          mkdir -p public/reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const arabicOutcome = process.env.ARABIC_OUTCOME || 'unknown';
          const englishOutcome = process.env.ENGLISH_OUTCOME || 'unknown';
          const matchesOutcome = process.env.MATCHES_OUTCOME || 'unknown';
          const newsValidateOutcome = process.env.NEWS_VALIDATE_OUTCOME || 'skipped';
          const matchesValidateOutcome = process.env.MATCHES_VALIDATE_OUTCOME || 'skipped';
          const newsOk = arabicOutcome === 'success' && englishOutcome === 'success' && newsValidateOutcome === 'success';
          const matchesOk = matchesOutcome === 'success' && matchesValidateOutcome === 'success';
          const ok = newsOk && matchesOk;
          const payload = {
            ok,
            generatedAt: new Date().toISOString(),
            mode: 'daily-football-news-update-free-hybrid',
            arabicOutcome,
            englishOutcome,
            matchesOutcome,
            newsValidateOutcome,
            matchesValidateOutcome,
            newsPublished: newsOk,
            matchesPublished: matchesOk,
            note: ok
              ? 'Arabic and English football news plus the hybrid match schedule were fetched and validated. Broadcasters are shown only when verified in the target countries.'
              : 'One football source or validation failed. Only the affected dataset was retained; any independently valid dataset was published, and the previous trusted data remains for the affected path.'
          };
          fs.writeFileSync('public/reports/daily-sports-news-status.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Commit validated football news data
        if: ${{ always() && steps.arabic.outcome == 'success' && steps.english.outcome == 'success' && steps.validateNews.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sports-news-ar.json public/data/sports-news-en.json
          if git diff --cached --quiet; then
            echo "No football news data changes to commit."
          else
            git commit -m "Update daily bilingual football news"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Commit validated football matches
        if: ${{ always() && steps.matches.outcome == 'success' && steps.validateMatches.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/football-matches.json
          if git diff --cached --quiet; then
            echo "No football match data changes to commit."
          else
            git commit -m "Update daily football match schedule"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Commit football workflow status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports/daily-sports-news-status.json
          if git diff --cached --quiet; then
            echo "No football status changes to commit."
          else
            git commit -m "Update football news workflow status"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Fail workflow if a football dataset or validation failed
        if: ${{ always() && (steps.arabic.outcome == 'failure' || steps.english.outcome == 'failure' || steps.matches.outcome == 'failure' || steps.validateNews.outcome == 'failure' || steps.validateMatches.outcome == 'failure') }}
        run: |
          echo "One football source or validation failed. Independently valid datasets were retained or published."
          echo "Arabic outcome: ${{ steps.arabic.outcome }}"
          echo "English outcome: ${{ steps.english.outcome }}"
          echo "Matches outcome: ${{ steps.matches.outcome }}"
          echo "News validation outcome: ${{ steps.validateNews.outcome }}"
          echo "Matches validation outcome: ${{ steps.validateMatches.outcome }}"
          exit 1
