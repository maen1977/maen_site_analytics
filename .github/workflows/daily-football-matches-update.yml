name: Football Match Schedule Update

on:
  schedule:
    # Twice every 24 hours at 03:37 and 15:37 Asia/Amman.
    # GitHub Actions cron is UTC; Jordan is UTC+3 year-round,
    # so 00:37 and 12:37 UTC run at 03:37 and 15:37 Jordan time.
    - cron: '37 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: football-match-schedule-update
  cancel-in-progress: false

jobs:
  update-football-matches:
    name: Fetch and publish football match times and broadcasters
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify Node runtime
        run: node --version

      - name: Install football data dependencies
        run: npm ci --no-audit --no-fund

      - name: Check match updater and validator
        run: |
          node --check scripts/fetch-bein-tv-guide.mjs
          node --check scripts/update-football-matches.mjs
          node --check scripts/test-football-matches.mjs

      - name: Update football match schedule
        id: matches
        continue-on-error: true
        run: xvfb-run -a npm run github:update-matches

      - name: Validate football match schedule
        id: validateMatches
        if: ${{ always() && steps.matches.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/test-football-matches.mjs

      - name: Write match schedule workflow status
        if: ${{ always() }}
        env:
          MATCHES_OUTCOME: ${{ steps.matches.outcome }}
          MATCHES_VALIDATE_OUTCOME: ${{ steps.validateMatches.outcome }}
        run: |
          mkdir -p public/reports
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const matchesOutcome = process.env.MATCHES_OUTCOME || 'unknown';
          const matchesValidateOutcome = process.env.MATCHES_VALIDATE_OUTCOME || 'skipped';
          const matchesPublished = matchesOutcome === 'success' && matchesValidateOutcome === 'success';
          let matchesTotal = 0;
          let matchesWithBroadcasters = 0;
          try {
            const schedule = JSON.parse(fs.readFileSync('public/data/football-matches.json', 'utf8'));
            matchesTotal = Array.isArray(schedule.items) ? schedule.items.length : 0;
            matchesWithBroadcasters = schedule.items.filter((item) => Array.isArray(item.broadcasters) && item.broadcasters.length > 0).length;
          } catch {
            // Keep status reporting available even when the schedule file is unavailable.
          }
          const broadcastCoveragePercent = matchesTotal ? Number((matchesWithBroadcasters / matchesTotal * 100).toFixed(2)) : 0;
          const payload = {
            ok: matchesPublished,
            generatedAt: new Date().toISOString(),
            mode: 'football-match-schedule-only',
            matchesOutcome,
            matchesValidateOutcome,
            matchesPublished,
            matchesTotal,
            matchesWithBroadcasters,
            broadcastCoveragePercent,
            newsCollection: false,
            note: matchesPublished
              ? 'Only football match times and verified broadcasters were fetched and validated. Coverage counters are included so low broadcaster availability is visible. No football news is collected or published.'
              : 'The match schedule or validation failed. The previous trusted schedule remains published.'
          };
          fs.writeFileSync('public/reports/football-matches-status.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE

      - name: Commit validated football match schedule
        if: ${{ always() && steps.matches.outcome == 'success' && steps.validateMatches.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/football-matches.json
          if git diff --cached --quiet; then
            echo "No football match data changes to commit."
          else
            git commit -m "Update football match schedule"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Commit match schedule workflow status
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports/football-matches-status.json
          if git diff --cached --quiet; then
            echo "No match schedule status changes to commit."
          else
            git commit -m "Update football match schedule status"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Fail workflow if the schedule or validation failed
        if: ${{ always() && (steps.matches.outcome == 'failure' || steps.validateMatches.outcome == 'failure') }}
        run: |
          echo "Football match schedule or validation failed; previous trusted schedule remains published."
          echo "Matches outcome: ${{ steps.matches.outcome }}"
          echo "Matches validation outcome: ${{ steps.validateMatches.outcome }}"
          exit 1
