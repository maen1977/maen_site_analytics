name: Maen daily automation

"on":
  schedule:
    # 20:30 UTC = 23:30 Jordan in summer time. Updates frequency data and commits the static JSON.
    - cron: '30 20 * * *'
    # 21:05 UTC = 00:05 Jordan in summer time. Sends yesterday's visitor analytics report.
    - cron: '5 21 * * *'
    # 21:45 UTC = 00:45 Jordan in summer time. Updates service knowledge index and daily report.
    - cron: '45 21 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frequencies
          - analytics
          - service
      report_date:
        description: 'Optional analytics local date YYYY-MM-DD'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: maen-daily-automation
  cancel-in-progress: false

jobs:
  update-frequencies:
    name: Update frequency database
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'both' || inputs.task == 'frequencies')) || (github.event_name == 'schedule' && github.event.schedule == '30 20 * * *') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily frequency update and latest updates feed
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          FREQUENCY_REPORT_EMAIL: ${{ secrets.FREQUENCY_REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          ANALYTICS_TIMEZONE: ${{ vars.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
          FREQUENCY_SOURCE_CONCURRENCY: ${{ vars.FREQUENCY_SOURCE_CONCURRENCY || '16' }}
          FREQUENCY_FETCH_TIMEOUT_MS: ${{ vars.FREQUENCY_FETCH_TIMEOUT_MS || '4500' }}
          FREQUENCY_REMOVE_MISSING: ${{ vars.FREQUENCY_REMOVE_MISSING || '1' }}
          FREQUENCY_MIN_CANDIDATES_FOR_REMOVAL: ${{ vars.FREQUENCY_MIN_CANDIDATES_FOR_REMOVAL || '50' }}
          FREQUENCY_MIN_SUCCESSFUL_SOURCES_FOR_REMOVAL: ${{ vars.FREQUENCY_MIN_SUCCESSFUL_SOURCES_FOR_REMOVAL || '5' }}
        run: node scripts/github-daily-frequency-update.mjs

      - name: Generate SEO files
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL || 'https://maensat.pages.dev' }}
        run: node scripts/generate-seo-files.mjs

      - name: Commit updated static frequency data, latest updates, and SEO files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frequencies/frequency-data.json public/frequencies/frequency-data.v*.json public/frequencies/frequency-manifest.json public/frequencies/search-index.json public/frequencies/latest-frequency-update-report.json public/updates/latest-updates.json public/updates/manual-updates.json public/sitemap.xml public/robots.txt public/site.webmanifest public/updates.html public/frequencies.html public/maintenance.html public/devices.html netlify/frequency-baseline.json
          if git diff --cached --quiet; then
            echo "No frequency changes to commit."
          else
            git commit -m "Daily frequency data update"
            git push
          fi

  send-analytics-report:
    name: Send visitor analytics report
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'both' || inputs.task == 'analytics')) || (github.event_name == 'schedule' && github.event.schedule == '5 21 * * *') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send daily analytics report from Cloudflare D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          ANALYTICS_TIMEZONE: ${{ vars.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
          REPORT_DATE: ${{ inputs.report_date || '' }}
        run: node scripts/github-daily-analytics-report.mjs


  service-knowledge-update:
    name: Update service knowledge and report
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.task == 'both' || inputs.task == 'service')) || (github.event_name == 'schedule' && github.event.schedule == '45 21 * * *') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build service knowledge index and report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ANALYTICS_TIMEZONE: ${{ vars.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
        run: node scripts/github-daily-service-update.mjs

      - name: Commit service knowledge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/service/index/service-search-index.json public/service/reports/daily-service-report.json public/service/reports/daily-service-report.md public/service/review/suggested-knowledge.json
          if git diff --cached --quiet; then
            echo "No service knowledge changes to commit."
          else
            git commit -m "Daily service knowledge update"
            git push
          fi
