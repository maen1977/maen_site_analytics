name: Fix World Cup team names permanently (skip final)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-worldcup-team-names-permanently
  cancel-in-progress: false

jobs:
  fix-names:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fix the generator and regenerate names without touching M104
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const generatorPath = 'scripts/worldcup-knockout-live-sync.mjs';
          const matchesPath = 'public/worldcup-2026/matches.json';
          const knockoutPath = 'public/worldcup-2026/knockout-live.json';
          const PATCH_MARKER = '20260720-arabic-team-name-guard-skip-m104-v1';

          function readJson(path) {
            return fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          }

          function writeJson(path, value) {
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n', 'utf8');
          }

          function matchNumber(match) {
            const value = match?.number ?? match?.match_number ?? match?.matchNumber ?? match?.id ?? match?.match_id;
            const found = String(value ?? '').match(/(\d{1,3})/);
            return found ? Number(found[1]) : 0;
          }

          function findMatch104(document) {
            if (!document) return null;
            if (Array.isArray(document.matches)) {
              const found = document.matches.find((match) => matchNumber(match) === 104);
              if (found) return found;
            }
            if (Array.isArray(document.rounds)) {
              for (const round of document.rounds) {
                const found = (round?.matches || []).find((match) => matchNumber(match) === 104);
                if (found) return found;
              }
            }
            return null;
          }

          function restoreMatch104(document, snapshot) {
            if (!document || !snapshot) return false;
            if (Array.isArray(document.matches)) {
              const index = document.matches.findIndex((match) => matchNumber(match) === 104);
              if (index >= 0) {
                document.matches[index] = snapshot;
                return true;
              }
            }
            if (Array.isArray(document.rounds)) {
              for (const round of document.rounds) {
                const index = (round?.matches || []).findIndex((match) => matchNumber(match) === 104);
                if (index >= 0) {
                  round.matches[index] = snapshot;
                  return true;
                }
              }
            }
            return false;
          }

          const beforeMatches = readJson(matchesPath);
          const beforeKnockout = readJson(knockoutPath);
          const finalMatchesSnapshot = structuredClone(findMatch104(beforeMatches));
          const finalKnockoutSnapshot = structuredClone(findMatch104(beforeKnockout));

          let source = fs.readFileSync(generatorPath, 'utf8');

          if (!source.includes(PATCH_MARKER)) {
            const dictionaryAndHelpers = String.raw`
          // ${PATCH_MARKER}
          const ARABIC_TEAM_NAME_GUARD = (() => {
            const rows = [
              [['Mexico'], 'المكسيك'],
              [['South Africa'], 'جنوب أفريقيا'],
              [['South Korea', 'Korea Republic'], 'كوريا الجنوبية'],
              [['Czechia', 'Czech Republic'], 'التشيك'],
              [['Canada'], 'كندا'],
              [['Bosnia and Herzegovina', 'Bosnia & Herzegovina', 'Bosnia-Herzegovina'], 'البوسنة والهرسك'],
              [['Qatar'], 'قطر'],
              [['Switzerland'], 'سويسرا'],
              [['Brazil'], 'البرازيل'],
              [['Morocco'], 'المغرب'],
              [['Haiti'], 'هايتي'],
              [['Scotland'], 'اسكتلندا'],
              [['United States', 'USA', 'United States of America'], 'الولايات المتحدة'],
              [['Paraguay'], 'باراغواي'],
              [['Australia'], 'أستراليا'],
              [['Turkey', 'Türkiye'], 'تركيا'],
              [['Germany'], 'ألمانيا'],
              [['Curacao', 'Curaçao'], 'كوراساو'],
              [['Ivory Coast', "Cote d'Ivoire", 'Côte d’Ivoire', 'Côte d\'Ivoire'], 'ساحل العاج'],
              [['Ecuador'], 'الإكوادور'],
              [['Netherlands', 'Holland'], 'هولندا'],
              [['Japan'], 'اليابان'],
              [['Sweden'], 'السويد'],
              [['Tunisia'], 'تونس'],
              [['Belgium'], 'بلجيكا'],
              [['Egypt'], 'مصر'],
              [['Iran'], 'إيران'],
              [['New Zealand'], 'نيوزيلندا'],
              [['Spain'], 'إسبانيا'],
              [['Cape Verde', 'Cabo Verde'], 'الرأس الأخضر'],
              [['Saudi Arabia'], 'السعودية'],
              [['Uruguay'], 'أوروغواي'],
              [['France'], 'فرنسا'],
              [['Senegal'], 'السنغال'],
              [['Iraq'], 'العراق'],
              [['Norway'], 'النرويج'],
              [['Argentina'], 'الأرجنتين'],
              [['Algeria'], 'الجزائر'],
              [['Austria'], 'النمسا'],
              [['Jordan'], 'الأردن'],
              [['Portugal'], 'البرتغال'],
              [['DR Congo', 'Congo DR', 'Democratic Republic of the Congo', 'Democratic Republic of Congo'], 'الكونغو الديمقراطية'],
              [['Uzbekistan'], 'أوزبكستان'],
              [['Colombia'], 'كولومبيا'],
              [['England'], 'إنجلترا'],
              [['Croatia'], 'كرواتيا'],
              [['Ghana'], 'غانا'],
              [['Panama'], 'بنما']
            ];
            const map = new Map();
            const key = (value) => String(value || '')
              .normalize('NFKD')
              .replace(/\p{Diacritic}/gu, '')
              .replace(/&/g, ' and ')
              .replace(/[^a-z0-9]+/gi, ' ')
              .replace(/\band\b/gi, ' ')
              .replace(/\s+/g, ' ')
              .trim()
              .toLowerCase();
            for (const [aliases, arabic] of rows) {
              for (const alias of aliases) map.set(key(alias), arabic);
            }
            return { map, key };
          })();

          function guardedArabicTeamName(englishName) {
            return ARABIC_TEAM_NAME_GUARD.map.get(ARABIC_TEAM_NAME_GUARD.key(englishName)) || '';
          }

          function applyArabicTeamNameGuard(team) {
            if (!team || typeof team !== 'object') return team;
            const englishName = text(team.name_en || team.team_en || team.english || team.name || team.team || '');
            const correctArabic = guardedArabicTeamName(englishName);
            if (correctArabic) team.name_ar = correctArabic;
            return team;
          }
          `;

            const mainMarker = 'function main() {';
            if (!source.includes(mainMarker)) {
              throw new Error(`Could not locate ${mainMarker} in ${generatorPath}`);
            }
            source = source.replace(mainMarker, dictionaryAndHelpers + '\n' + mainMarker);

            const safetyMarker = '// Sync the same resolved teams back into matches.json';
            const safetyBlock = String.raw`
          // Apply the Arabic-name guard to every knockout match except the final M104.
          // The English name is the authority, so a leaked "سويسرا" value cannot spread to other teams.
          for (const m of normalizedMatches) {
            if (Number(m.number) === 104) continue;
            applyArabicTeamNameGuard(m.team1);
            applyArabicTeamNameGuard(m.team2);
          }

          `;
            if (!source.includes(safetyMarker)) {
              throw new Error(`Could not locate knockout safety marker in ${generatorPath}`);
            }
            source = source.replace(safetyMarker, safetyBlock + safetyMarker);

            const syncCallMarker = 'const matchesJsonSync = applyResolvedKnockoutTeamsToMatchesJson();';
            const matchesGuardBlock = String.raw`
          // Correct Arabic names in matches.json itself, but never modify match M104.
          let arabicNamesGuardChanged = false;
          if (matchesJson && Array.isArray(matchesJson.matches)) {
            matchesJson.team_ar = matchesJson.team_ar && typeof matchesJson.team_ar === 'object' ? matchesJson.team_ar : {};
            for (const raw of matchesJson.matches) {
              const n = matchNumber(raw);
              if (n === 104) continue;
              const team1English = text(typeof raw.team1 === 'object'
                ? (raw.team1.name_en || raw.team1.name || raw.team1.team || '')
                : raw.team1);
              const team2English = text(typeof raw.team2 === 'object'
                ? (raw.team2.name_en || raw.team2.name || raw.team2.team || '')
                : raw.team2);
              const team1Arabic = guardedArabicTeamName(team1English);
              const team2Arabic = guardedArabicTeamName(team2English);
              if (team1Arabic) {
                if (typeof raw.team1 === 'object' && raw.team1) {
                  if (raw.team1.name_ar !== team1Arabic) { raw.team1.name_ar = team1Arabic; arabicNamesGuardChanged = true; }
                }
                if (raw.team1_ar !== team1Arabic) { raw.team1_ar = team1Arabic; arabicNamesGuardChanged = true; }
                if (matchesJson.team_ar[team1English] !== team1Arabic) { matchesJson.team_ar[team1English] = team1Arabic; arabicNamesGuardChanged = true; }
              }
              if (team2Arabic) {
                if (typeof raw.team2 === 'object' && raw.team2) {
                  if (raw.team2.name_ar !== team2Arabic) { raw.team2.name_ar = team2Arabic; arabicNamesGuardChanged = true; }
                }
                if (raw.team2_ar !== team2Arabic) { raw.team2_ar = team2Arabic; arabicNamesGuardChanged = true; }
                if (matchesJson.team_ar[team2English] !== team2Arabic) { matchesJson.team_ar[team2English] = team2Arabic; arabicNamesGuardChanged = true; }
              }
            }
            if (arabicNamesGuardChanged) writeJson('matches.json', matchesJson);
          }

          `;
            if (!source.includes(syncCallMarker)) {
              throw new Error(`Could not locate matches sync call in ${generatorPath}`);
            }
            source = source.replace(syncCallMarker, matchesGuardBlock + syncCallMarker);

            // The existing sync must also stop at M103 so the final stays untouched.
            source = source.replace(
              'if (n < 89 || n > 104) continue;',
              'if (n < 89 || n > 103) continue;'
            );

            fs.writeFileSync(generatorPath, source, 'utf8');
          }

          execFileSync(process.execPath, [generatorPath], { stdio: 'inherit' });

          // Restore M104 byte-for-byte at object level after regeneration.
          const afterMatches = readJson(matchesPath);
          const afterKnockout = readJson(knockoutPath);
          if (finalMatchesSnapshot && restoreMatch104(afterMatches, finalMatchesSnapshot)) writeJson(matchesPath, afterMatches);
          if (finalKnockoutSnapshot && restoreMatch104(afterKnockout, finalKnockoutSnapshot)) writeJson(knockoutPath, afterKnockout);

          // Final verification: "سويسرا" is allowed only when the English team is Switzerland.
          const aliases = new Map([
            ['mexico','المكسيك'],['south africa','جنوب أفريقيا'],['south korea','كوريا الجنوبية'],['korea republic','كوريا الجنوبية'],
            ['czechia','التشيك'],['czech republic','التشيك'],['canada','كندا'],['bosnia and herzegovina','البوسنة والهرسك'],
            ['bosnia & herzegovina','البوسنة والهرسك'],['qatar','قطر'],['switzerland','سويسرا'],['brazil','البرازيل'],
            ['morocco','المغرب'],['haiti','هايتي'],['scotland','اسكتلندا'],['united states','الولايات المتحدة'],['usa','الولايات المتحدة'],
            ['paraguay','باراغواي'],['australia','أستراليا'],['turkey','تركيا'],['türkiye','تركيا'],['germany','ألمانيا'],
            ['curacao','كوراساو'],['curaçao','كوراساو'],['ivory coast','ساحل العاج'],["cote d'ivoire",'ساحل العاج'],
            ['ecuador','الإكوادور'],['netherlands','هولندا'],['japan','اليابان'],['sweden','السويد'],['tunisia','تونس'],
            ['belgium','بلجيكا'],['egypt','مصر'],['iran','إيران'],['new zealand','نيوزيلندا'],['spain','إسبانيا'],
            ['cape verde','الرأس الأخضر'],['cabo verde','الرأس الأخضر'],['saudi arabia','السعودية'],['uruguay','أوروغواي'],
            ['france','فرنسا'],['senegal','السنغال'],['iraq','العراق'],['norway','النرويج'],['argentina','الأرجنتين'],
            ['algeria','الجزائر'],['austria','النمسا'],['jordan','الأردن'],['portugal','البرتغال'],['dr congo','الكونغو الديمقراطية'],
            ['congo dr','الكونغو الديمقراطية'],['uzbekistan','أوزبكستان'],['colombia','كولومبيا'],['england','إنجلترا'],
            ['croatia','كرواتيا'],['ghana','غانا'],['panama','بنما']
          ]);

          const failures = [];
          function verifyMatch(match, where) {
            if (matchNumber(match) === 104) return;
            for (const [side, arField] of [['team1','team1_ar'], ['team2','team2_ar']]) {
              const value = match?.[side];
              const english = typeof value === 'object' && value
                ? String(value.name_en || value.name || value.team || '').trim()
                : String(value || '').trim();
              const arabic = typeof value === 'object' && value
                ? String(value.name_ar || '').trim()
                : String(match?.[arField] || '').trim();
              const expected = aliases.get(english.toLowerCase());
              if (expected && arabic !== expected) failures.push(`${where} M${matchNumber(match)} ${side}: ${english} -> ${arabic}, expected ${expected}`);
              if (arabic === 'سويسرا' && english.toLowerCase() !== 'switzerland') failures.push(`${where} M${matchNumber(match)} ${side}: leaked سويسرا onto ${english}`);
            }
          }

          const verifiedMatches = readJson(matchesPath);
          for (const match of verifiedMatches?.matches || []) verifyMatch(match, 'matches.json');
          const verifiedKnockout = readJson(knockoutPath);
          for (const round of verifiedKnockout?.rounds || []) for (const match of round?.matches || []) verifyMatch(match, 'knockout-live.json');

          if (JSON.stringify(findMatch104(verifiedMatches)) !== JSON.stringify(finalMatchesSnapshot)) failures.push('M104 changed in matches.json');
          if (JSON.stringify(findMatch104(verifiedKnockout)) !== JSON.stringify(finalKnockoutSnapshot)) failures.push('M104 changed in knockout-live.json');

          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`[${PATCH_MARKER}] success: names corrected and M104 preserved.`);
          NODE

      - name: Commit corrected names
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/worldcup-knockout-live-sync.mjs public/worldcup-2026/matches.json public/worldcup-2026/knockout-live.json
          git commit -m "fix(worldcup): correct team names without touching final"
          git push
