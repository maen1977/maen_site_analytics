name: Rollback ChatGPT World Cup fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove injected World Cup UI/cache fixes
        run: node scripts/rollback-worldcup-chatgpt-fixes.mjs

      - name: Commit rollback cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code; then
            echo "No rollback changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Rollback ChatGPT World Cup UI fixes"
          git push
