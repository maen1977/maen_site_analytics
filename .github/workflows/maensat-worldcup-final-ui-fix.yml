name: MaenSat World Cup final UI fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maensat-worldcup-final-ui-fix
  cancel-in-progress: true

jobs:
  install-final-ui-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install final World Cup UI fix
        run: node scripts/install-worldcup-final-ui-fix.mjs

      - name: Commit final UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/index_phone.html public/_headers public/worldcup-final-ui-fix.js public/worldcup-2026/final-ui-fix-marker.json scripts/install-worldcup-final-ui-fix.mjs .github/workflows/maensat-worldcup-final-ui-fix.yml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Install final World Cup 2026 UI fix"
            git push
          else
            echo "No changes to commit."
          fi
