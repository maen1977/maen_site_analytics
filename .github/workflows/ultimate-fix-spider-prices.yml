name: Ultimate fix Spider prices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/ultimate-fix-spider-prices.mjs"
      - ".github/workflows/ultimate-fix-spider-prices.yml"

permissions:
  contents: write

concurrency:
  group: ultimate-fix-spider-prices
  cancel-in-progress: true

jobs:
  ultimate-fix-spider-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check script
        run: node --check scripts/ultimate-fix-spider-prices.mjs

      - name: Fix Spider prices everywhere safe
        run: node scripts/ultimate-fix-spider-prices.mjs

      - name: Commit ultimate price fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html public/index_phone.html scripts/ultimate-fix-spider-prices.mjs .github/workflows/ultimate-fix-spider-prices.yml

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Ultimate fix Spider T777 and T666 prices"
            git push
          else
            echo "No changes to commit."
          fi
