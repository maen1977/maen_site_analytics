name: World Cup 2026 updates disabled

# انتهت البطولة. لا توجد جدولة تلقائية ولا تحديث كل 15 دقيقة.
# أبقينا التشغيل اليدوي فقط كصفحة حالة، ولا يتم تعديل أي ملفات.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Ignored: World Cup 2026 updates are disabled"
        required: false
        default: "manual"
      forced_at:
        description: "Ignored external scheduler timestamp"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: worldcup-2026-updates-disabled
  cancel-in-progress: true

jobs:
  updates-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: World Cup 2026 archive is final
        shell: bash
        run: |
          echo "World Cup 2026 automatic updates are permanently disabled."
          echo "Tournament status: finished"
          echo "Champion: Spain"
          echo "Final: Spain 1-0 Argentina"
          echo "No repository files were changed."
