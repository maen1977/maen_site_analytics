name: Update World Cup 2026 every 15 minutes

on:
  schedule:
    # كل ربع ساعة بتوقيت UTC. اخترنا دقائق بعيدة عن رأس الساعة لتقليل تأخير GitHub Actions.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldcup-2026-quarter-hour
  cancel-in-progress: false

env:
  TZ: Asia/Amman
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  WORLD_CUP_2026_FORCE_UPDATE: "1"
  WORLD_CUP_2026_INTERVAL_MINUTES: "15"
  WORLD_CUP_2026_START_DATE: "2026-06-11"
  WORLD_CUP_2026_END_DATE: "2026-07-19"
  WORLD_CUP_2026_ESPN_SCOREBOARD_URL: ${{ vars.WORLD_CUP_2026_ESPN_SCOREBOARD_URL || 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200' }}
  WORLD_CUP_2026_BROADCAST_SOURCE_URL: ${{ vars.WORLD_CUP_2026_BROADCAST_SOURCE_URL || '' }}
  CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '218002bc26df57e7e750a6cf8107ef4a' }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'maensat' }}

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate updater script
        run: node --check scripts/worldcup-quarter-hour-force.mjs

      - name: Force quarter-hour World Cup check
        run: node scripts/worldcup-quarter-hour-force.mjs

      - name: Commit changed World Cup files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/worldcup-2026 public/_headers scripts/worldcup-quarter-hour-force.mjs .github/workflows/update-worldcup-2026.yml

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed files to commit."
            exit 0
          fi

          git commit -m "Force World Cup 2026 quarter-hour check"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || { git pull --rebase --autostash origin main; git push origin HEAD:main; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy hook
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_PAGES_DEPLOY_HOOK:-}" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is not set; skipping deploy hook."
            echo "If Cloudflare Pages is connected to GitHub, the push above should deploy automatically."
            exit 0
          fi
          echo "Triggering Cloudflare Pages deploy hook..."
          curl --fail --show-error --silent --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          echo "Cloudflare Pages deploy hook triggered."

      - name: Optional direct Cloudflare Pages deploy with Wrangler
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; skipping direct Wrangler deploy."
            exit 0
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_PAGES_PROJECT:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_PAGES_PROJECT missing; skipping direct Wrangler deploy."
            exit 0
          fi
          echo "Deploying public/ directly to Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT"
          npx --yes wrangler@latest pages deploy public --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main
