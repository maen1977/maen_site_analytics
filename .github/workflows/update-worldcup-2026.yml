name: Update World Cup 2026 data

on:
  schedule:
    # Hourly check. The script skips this run automatically on days without World Cup matches in Jordan time.
    - cron: "17 * * * *"
    # Baseline check every 12 hours: 03:07 and 15:07 in Jordan time while Jordan is UTC+3.
    - cron: "7 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worldcup-2026
  cancel-in-progress: true

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update World Cup 2026 fixtures and scores
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/update-worldcup-2026.mjs

      - name: Commit updated World Cup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/worldcup-2026)" ]; then
            git add public/worldcup-2026
            git commit -m "Update World Cup 2026 data"
            git push
          else
            echo "No World Cup 2026 changes to commit."
          fi
