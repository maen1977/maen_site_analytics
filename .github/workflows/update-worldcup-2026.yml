name: Update World Cup 2026 every 15 minutes

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldcup-2026-quarter-hour
  cancel-in-progress: true

env:
  TZ: Asia/Amman
  CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}

jobs:
  enforce-canonical-world-cup-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_FOR_AUTOMATION || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate canonical scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/worldcup-canonical-finalizer.mjs
          node --check scripts/worldcup-state-validator.mjs

      - name: Enforce all knockout matches and final result
        shell: bash
        run: node scripts/worldcup-canonical-finalizer.mjs

      - name: Reject any wrong pairing, score, or leaked Switzerland name
        shell: bash
        run: node scripts/worldcup-state-validator.mjs

      - name: Commit corrected World Cup data
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/worldcup-2026/matches.json \
            public/worldcup-2026/bracket.json \
            public/worldcup-2026/knockout-live.json \
            public/worldcup-2026/knockout-live-health.json \
            public/worldcup-2026/manual-results-overrides.json \
            public/worldcup-2026/canonical-finalizer-status.json \
            public/worldcup-2026/state-validator-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Canonical World Cup data already correct."
            exit 0
          fi
          git commit -m "Fix all World Cup knockout matches and final Spain 1-0 Argentina"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy hook
        if: steps.commit.outputs.changed == 'true' && env.CLOUDFLARE_PAGES_DEPLOY_HOOK != ''
        shell: bash
        run: curl --fail --show-error --silent --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
