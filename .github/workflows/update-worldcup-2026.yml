name: Update World Cup 2026 data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # فحص كل 15 دقيقة.
    - cron: "2,17,32,47 * * * *"
    # فحص احتياطي مرتين يوميًا.
    - cron: "7 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worldcup-2026
  cancel-in-progress: true

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run existing World Cup updater
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

          # مهم: لا تخلي التحديث الذكي ينام أثناء يوم المباريات.
          WORLD_CUP_2026_FAST_BEFORE_MINUTES: "1440"
          WORLD_CUP_2026_FAST_AFTER_MINUTES: "1440"
          WORLD_CUP_2026_BROADCAST_BEFORE_MINUTES: "1440"
          WORLD_CUP_2026_BROADCAST_AFTER_MINUTES: "1440"

          WORLD_CUP_2026_BROADCAST_SOURCE_URL: ${{ vars.WORLD_CUP_2026_BROADCAST_SOURCE_URL }}
          WORLD_CUP_2026_BEIN_AUTO_CHECK: ${{ vars.WORLD_CUP_2026_BEIN_AUTO_CHECK || '1' }}
          WORLD_CUP_2026_BEIN_NEWS_URLS: ${{ vars.WORLD_CUP_2026_BEIN_NEWS_URLS || '' }}
          WORLD_CUP_2026_BEIN_MAX_DISCOVERED_ARTICLES: ${{ vars.WORLD_CUP_2026_BEIN_MAX_DISCOVERED_ARTICLES || '12' }}
          WORLD_CUP_2026_BEIN_CONFIRMATION_SCORE: ${{ vars.WORLD_CUP_2026_BEIN_CONFIRMATION_SCORE || '80' }}
        run: node scripts/update-worldcup-2026.mjs

      - name: Merge safe structured result sources
        run: node scripts/merge-worldcup-multisource.mjs

      - name: Repair future or impossible scores
        run: node scripts/repair-worldcup-future-scores.mjs

      - name: Finalize stale live matches
        env:
          WORLD_CUP_2026_AUTO_FINALIZE_AFTER_MINUTES: "130"
        run: node scripts/finalize-worldcup-stale-live.mjs

      - name: Apply manual result overrides and rebuild standings
        run: node scripts/apply-worldcup-overrides.mjs

      - name: Touch World Cup last checked timestamp
        run: node scripts/touch-worldcup-last-checked.mjs

      - name: Commit updated World Cup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/worldcup-2026 scripts/touch-worldcup-last-checked.mjs scripts/finalize-worldcup-stale-live.mjs scripts/merge-worldcup-multisource.mjs scripts/apply-worldcup-overrides.mjs scripts/repair-worldcup-future-scores.mjs .github/workflows/update-worldcup-2026.yml)" ]; then
            git add public/worldcup-2026 scripts/touch-worldcup-last-checked.mjs scripts/finalize-worldcup-stale-live.mjs scripts/merge-worldcup-multisource.mjs scripts/apply-worldcup-overrides.mjs scripts/repair-worldcup-future-scores.mjs .github/workflows/update-worldcup-2026.yml
            git commit -m "Update World Cup 2026 data"
            git push
          else
            echo "No World Cup 2026 changes to commit."
          fi
