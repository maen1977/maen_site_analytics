name: Update World Cup 2026 data

on:
  schedule:
    # Every 15 minutes, UTC. Offset away from exact hour to reduce GitHub cron congestion.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worldcup-2026
  cancel-in-progress: true

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check required World Cup scripts
        run: |
          if [ -f scripts/update-worldcup-2026.mjs ]; then node --check scripts/update-worldcup-2026.mjs; fi
          node --check scripts/touch-worldcup-last-checked.mjs

      - name: Run World Cup updater every quarter hour
        continue-on-error: true
        env:
          WORLD_CUP_2026_FORCE_UPDATE: "1"
          FORCE_UPDATE: "1"

          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

          WORLD_CUP_2026_FAST_BEFORE_MINUTES: "1000000"
          WORLD_CUP_2026_FAST_AFTER_MINUTES: "1000000"
          WORLD_CUP_2026_BROADCAST_BEFORE_MINUTES: "1000000"
          WORLD_CUP_2026_BROADCAST_AFTER_MINUTES: "1000000"

          WORLD_CUP_2026_BROADCAST_SOURCE_URL: ${{ vars.WORLD_CUP_2026_BROADCAST_SOURCE_URL }}
          WORLD_CUP_2026_BEIN_AUTO_CHECK: ${{ vars.WORLD_CUP_2026_BEIN_AUTO_CHECK || '1' }}
          WORLD_CUP_2026_BEIN_NEWS_URLS: ${{ vars.WORLD_CUP_2026_BEIN_NEWS_URLS || '' }}
          WORLD_CUP_2026_BEIN_MAX_DISCOVERED_ARTICLES: ${{ vars.WORLD_CUP_2026_BEIN_MAX_DISCOVERED_ARTICLES || '12' }}
          WORLD_CUP_2026_BEIN_CONFIRMATION_SCORE: ${{ vars.WORLD_CUP_2026_BEIN_CONFIRMATION_SCORE || '80' }}
        run: |
          if [ -f scripts/update-worldcup-2026.mjs ]; then
            node scripts/update-worldcup-2026.mjs
          else
            echo "scripts/update-worldcup-2026.mjs not found, skipping updater."
          fi

      - name: Merge safe structured result sources
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/merge-worldcup-multisource.mjs ]; then
            node scripts/merge-worldcup-multisource.mjs
          else
            echo "merge-worldcup-multisource.mjs not found, skipping."
          fi

      - name: Repair future or impossible scores
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/repair-worldcup-future-scores.mjs ]; then
            node scripts/repair-worldcup-future-scores.mjs
          else
            echo "repair-worldcup-future-scores.mjs not found, skipping."
          fi

      - name: Finalize stale live matches
        if: always()
        continue-on-error: true
        env:
          WORLD_CUP_2026_AUTO_FINALIZE_AFTER_MINUTES: "130"
        run: |
          if [ -f scripts/finalize-worldcup-stale-live.mjs ]; then
            node scripts/finalize-worldcup-stale-live.mjs
          else
            echo "finalize-worldcup-stale-live.mjs not found, skipping."
          fi

      - name: Apply manual result overrides and rebuild standings
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/apply-worldcup-overrides.mjs ]; then
            node scripts/apply-worldcup-overrides.mjs
          else
            echo "apply-worldcup-overrides.mjs not found, skipping."
          fi

      - name: Touch quarter-hour heartbeat and deploy marker
        if: always()
        run: node scripts/touch-worldcup-last-checked.mjs

      - name: Commit and push World Cup update
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/worldcup-2026 public/_headers scripts/touch-worldcup-last-checked.mjs .github/workflows/update-worldcup-2026.yml

          if git diff --cached --quiet; then
            echo "No staged changes found."
          else
            git commit -m "Update World Cup 2026 quarter-hour heartbeat"
            git push
          fi

      - name: Trigger Cloudflare Pages deploy hook
        if: always()
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set. Skipping deploy hook."
            echo "GitHub files were still updated. Add the secret to force Cloudflare deploys."
            exit 0
          fi

          echo "Triggering Cloudflare Pages deploy hook..."
          curl --fail --show-error --silent --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          echo ""
          echo "Cloudflare Pages deploy hook triggered."
