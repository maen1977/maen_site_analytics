name: Update World Cup 2026 data

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Smart match-window check every 15 minutes. The script skips immediately unless a match is near or live.
    - cron: "2,17,32,47 * * * *"
    # Baseline check every 12 hours: 03:07 and 15:07 in Jordan time while Jordan is UTC+3.
    - cron: "7 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-worldcup-2026
  cancel-in-progress: true

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Update World Cup 2026 fixtures, scores, and broadcasters
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORLD_CUP_2026_BROADCAST_SOURCE_URL: ${{ vars.WORLD_CUP_2026_BROADCAST_SOURCE_URL }}
        run: node scripts/update-worldcup-2026.mjs

      - name: Commit updated World Cup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/worldcup-2026)" ]; then
            git add public/worldcup-2026
            git commit -m "Update World Cup 2026 data"
            git push
          else
            echo "No World Cup 2026 changes to commit."
          fi
