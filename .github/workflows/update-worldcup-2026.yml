name: Update World Cup 2026 every 15 minutes

on:
  schedule:
    # كل ربع ساعة تقريباً بتوقيت UTC
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Trigger source: manual / github-watchdog / cloudflare-cron"
        required: false
        default: "manual"
      forced_at:
        description: "External scheduler timestamp, if any"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: worldcup-2026-quarter-hour
  cancel-in-progress: false

env:
  TZ: Asia/Amman
  WORLD_CUP_2026_FORCE_UPDATE: "1"
  WORLD_CUP_2026_INTERVAL_MINUTES: "15"
  WORLD_CUP_2026_START_DATE: "2026-06-11"
  WORLD_CUP_2026_END_DATE: "2026-07-19"
  WORLD_CUP_2026_TRIGGER_SOURCE: ${{ github.event.inputs.source || github.event_name }}
  WORLD_CUP_2026_FORCED_AT: ${{ github.event.inputs.forced_at || '' }}
  WORLD_CUP_2026_ESPN_SCOREBOARD_URL: ${{ vars.WORLD_CUP_2026_ESPN_SCOREBOARD_URL || 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=950' }}
  CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}

jobs:
  update-worldcup-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT_FOR_AUTOMATION || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Print trigger info
        shell: bash
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          echo "workflow=${GITHUB_WORKFLOW}"
          echo "trigger_source=${WORLD_CUP_2026_TRIGGER_SOURCE}"
          echo "forced_at=${WORLD_CUP_2026_FORCED_AT}"
          echo "cloudflare_hook_configured=$([ -n \"${CLOUDFLARE_PAGES_DEPLOY_HOOK:-}\" ] && echo yes || echo no)"

      - name: Validate World Cup scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/worldcup-quarter-hour-force.mjs
          node --check scripts/worldcup-bracket-linker.mjs
          node --check scripts/worldcup-cache-headers-safe.mjs

      - name: Force quarter-hour World Cup score check
        id: updater
        continue-on-error: true
        run: node scripts/worldcup-quarter-hour-force.mjs

      - name: Resolve bracket team names from group standings
        run: node scripts/worldcup-bracket-linker.mjs

      - name: Keep World Cup JSON uncached
        run: node scripts/worldcup-cache-headers-safe.mjs

      - name: Show generated status
        shell: bash
        run: |
          set -euo pipefail
          echo "--- deploy marker ---"
          cat public/worldcup-2026/deploy-marker.txt 2>/dev/null || true
          echo "--- bracket health ---"
          cat public/worldcup-2026/bracket-linker-status.json 2>/dev/null || true
          echo "--- deploy health ---"
          cat public/worldcup-2026/deploy-health.json 2>/dev/null || true

      - name: Commit changed World Cup files
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/worldcup-2026/matches.json \
            public/worldcup-2026/standings.json \
            public/worldcup-2026/groups.json \
            public/worldcup-2026/bracket.json \
            public/worldcup-2026/broadcasts.json \
            public/worldcup-2026/heartbeat.json \
            public/worldcup-2026/update-check.json \
            public/worldcup-2026/version.json \
            public/worldcup-2026/update-errors.json \
            public/worldcup-2026/deploy-marker.txt \
            public/worldcup-2026/bracket-linker-status.json \
            public/worldcup-2026/deploy-health.json \
            public/_headers 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed files to commit."
            exit 0
          fi

          stamp="$(TZ=Asia/Amman date +'%Y-%m-%d %H:%M:%S %Z')"
          git commit -m "Fix World Cup 2026 live update and bracket names ${stamp}"
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main || { git pull --rebase --autostash origin main; git push origin HEAD:main; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages deploy hook
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_PAGES_DEPLOY_HOOK:-}" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK is not set; relying on Cloudflare GitHub integration if connected."
            exit 0
          fi
          echo "Triggering Cloudflare Pages deploy hook..."
          curl --fail --show-error --silent --request POST "$CLOUDFLARE_PAGES_DEPLOY_HOOK"
          echo "Cloudflare Pages deploy hook triggered."
