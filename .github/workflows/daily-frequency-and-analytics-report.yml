name: Daily frequency and analytics reports

on:
  schedule:
    # 05:15 UTC = about 08:15 in Jordan when Jordan is UTC+3.
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'What should run?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frequency_only
          - analytics_only
      report_date:
        description: 'Optional analytics report date in Jordan calendar, YYYY-MM-DD. Leave empty for yesterday.'
        required: false
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: daily-frequency-and-analytics-report
  cancel-in-progress: false

jobs:
  daily-reports:
    name: Update frequencies and email daily reports
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANALYTICS_TIMEZONE: ${{ secrets.ANALYTICS_TIMEZONE || 'Asia/Amman' }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://maensat.pages.dev' }}
      PAGES_BASE_URL: ${{ secrets.PUBLIC_BASE_URL || 'https://maensat.pages.dev' }}
      FREQUENCY_SOURCE_CONCURRENCY: ${{ secrets.FREQUENCY_SOURCE_CONCURRENCY || '12' }}
      FREQUENCY_MIN_SUCCESSFUL_SOURCES_FOR_PUBLISH: ${{ secrets.FREQUENCY_MIN_SUCCESSFUL_SOURCES_FOR_PUBLISH || '5' }}
      FREQUENCY_MIN_CANDIDATES_FOR_PUBLISH: ${{ secrets.FREQUENCY_MIN_CANDIDATES_FOR_PUBLISH || '50' }}
      FREQUENCY_MIN_BASELINE_RETAIN_RATIO: ${{ secrets.FREQUENCY_MIN_BASELINE_RETAIN_RATIO || '0.75' }}
      FREQUENCY_MAX_REMOVALS_PER_RUN: ${{ secrets.FREQUENCY_MAX_REMOVALS_PER_RUN || '250' }}
      FREQUENCY_ALLOW_PUBLISH_SHRINK: ${{ secrets.FREQUENCY_ALLOW_PUBLISH_SHRINK || '0' }}
      FREQUENCY_MIN_COMPLETE_CANDIDATES_FOR_REMOVAL: ${{ secrets.FREQUENCY_MIN_COMPLETE_CANDIDATES_FOR_REMOVAL || '25' }}
      FREQUENCY_MIN_VALID_TUNING_FOR_REMOVAL: ${{ secrets.FREQUENCY_MIN_VALID_TUNING_FOR_REMOVAL || '50' }}
      FREQUENCY_REMOVE_MISSING_AFTER_CHECKS: ${{ secrets.FREQUENCY_REMOVE_MISSING_AFTER_CHECKS || '3' }}
      FREQUENCY_MIN_MISSING_CONFIRMATION_SITES: ${{ secrets.FREQUENCY_MIN_MISSING_CONFIRMATION_SITES || '2' }}
      FREQUENCY_REMOVE_MOVED_CHANNELS: ${{ secrets.FREQUENCY_REMOVE_MOVED_CHANNELS || '1' }}
      REPORT_DATE: ${{ github.event.inputs.report_date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify Node runtime
        run: node --version

      - name: Verify daily report environment
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/verify-daily-report-env.mjs

      - name: Check daily report scripts
        run: |
          node --check scripts/github-daily-frequency-update.mjs
          node --check scripts/github-daily-analytics-report.mjs
          node --check scripts/verify-daily-report-env.mjs
          node scripts/test-frequency-move-cleanup.mjs
          node scripts/test-frequency-multi-site-removal.mjs
          node scripts/test-frequency-publish-guard.mjs
          node scripts/test-frequency-ui-safety.mjs
          node scripts/test-device-image-assets.mjs

      - name: Run daily frequency update and email report
        id: frequency
        if: ${{ github.event_name == 'schedule' || github.event.inputs.run_mode == 'all' || github.event.inputs.run_mode == 'frequency_only' }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
        run: npm run github:update-frequencies

      - name: Commit frequency JSON changes
        if: ${{ always() && steps.frequency.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/frequencies netlify/frequency-baseline.json public/reports/daily-github-actions-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No frequency changes to commit."
          else
            git commit -m "Update daily frequency data"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Run Cloudflare D1 analytics email report
        id: analytics
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.run_mode == 'all' || github.event.inputs.run_mode == 'analytics_only') }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
          REPORT_FROM: ${{ secrets.REPORT_FROM }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run github:analytics-report

      - name: Write workflow status file
        if: ${{ always() }}
        env:
          FREQUENCY_OUTCOME: ${{ steps.frequency.outcome }}
          ANALYTICS_OUTCOME: ${{ steps.analytics.outcome }}
        run: |
          mkdir -p public/reports
          node - <<'NODE'
          const fs = require('fs');
          const frequencyOutcome = process.env.FREQUENCY_OUTCOME || 'unknown';
          const analyticsOutcome = process.env.ANALYTICS_OUTCOME || 'unknown';
          const failed = ['failure', 'cancelled'];
          const ok = !failed.includes(frequencyOutcome) && !failed.includes(analyticsOutcome);
          const payload = {
            ok,
            generatedAt: new Date().toISOString(),
            mode: 'github-actions-daily-reports-restored',
            timezone: process.env.ANALYTICS_TIMEZONE || 'Asia/Amman',
            publicBaseUrl: process.env.PUBLIC_BASE_URL || 'https://maensat.pages.dev',
            frequencyOutcome,
            analyticsOutcome,
            note: ok
              ? 'GitHub Actions completed the enabled daily tasks. Secrets are not written to this file.'
              : 'One or more daily tasks failed. A frequency publish guard failure keeps the last trusted frequency database in place; review the Action log before changing thresholds.'
          };
          fs.writeFileSync('public/reports/daily-github-actions-status.json', JSON.stringify(payload, null, 2) + '\n');
          NODE

      - name: Commit workflow status file
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/reports/daily-github-actions-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Update daily report workflow status"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Fail workflow if a daily task failed
        if: ${{ always() && (steps.frequency.outcome == 'failure' || steps.analytics.outcome == 'failure') }}
        run: |
          echo "One or more daily report tasks failed. Check the logs above."
          echo "frequency outcome: ${{ steps.frequency.outcome }}"
          echo "analytics outcome: ${{ steps.analytics.outcome }}"
          exit 1
