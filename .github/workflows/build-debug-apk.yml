name: Build Maensat Safe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build signed release APK on GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Remove old duplicated Java source folder
        run: rm -rf app/src/main/java

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK for phone install
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/maensat-sms-sender-safe.apk
          ls -lah out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maensat-sms-sender-safe-install-apk
          path: out/maensat-sms-sender-safe.apk
