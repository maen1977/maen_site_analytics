name: World Cup knockout live cards

on:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: write

concurrency:
  group: worldcup-knockout-live-cards
  cancel-in-progress: false

jobs:
  update-knockout-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run existing World Cup updater if available
        run: |
          if [ -f scripts/update-worldcup-2026.mjs ]; then
            node scripts/update-worldcup-2026.mjs || echo "Existing updater failed; continuing with current JSON files."
          fi

      - name: Build knockout live data
        run: node scripts/worldcup-knockout-live-sync.mjs

      - name: Install knockout cards UI safely
        run: node scripts/install-worldcup-knockout-cards-ui.mjs

      - name: Commit updated World Cup knockout cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/worldcup-2026/knockout-live.json public/worldcup-2026/knockout-live-health.json public/worldcup-knockout-cards-ui.js public/index.html public/index_phone.html public/_headers scripts/worldcup-knockout-live-sync.mjs scripts/install-worldcup-knockout-cards-ui.mjs .github/workflows/worldcup-knockout-live-cards.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update World Cup knockout live cards"
            git push
          fi
