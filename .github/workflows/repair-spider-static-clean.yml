name: Repair Spider static clean

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-spider-static-clean
  cancel-in-progress: true

jobs:
  repair-spider-static-clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check repair script
        run: node --check scripts/repair-spider-static-clean.mjs

      - name: Repair Spider devices statically
        run: node scripts/repair-spider-static-clean.mjs

      - name: Commit static Spider repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/index.html public/index_phone.html scripts/repair-spider-static-clean.mjs .github/workflows/repair-spider-static-clean.yml

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Repair Spider device cards statically"
            git push
          else
            echo "No changes to commit."
          fi
