name: Install Spider devices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/assets/spider-new-devices.js"
      - "public/assets/devices/spider-t777-elite-master-plus.jpg"
      - "public/assets/devices/spider-t666-gold-plus-5g.jpg"
      - "scripts/install-spider-devices.mjs"
      - ".github/workflows/install-spider-devices.yml"

permissions:
  contents: write

concurrency:
  group: install-spider-devices
  cancel-in-progress: true

jobs:
  install-spider-devices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check installer
        run: |
          node --check scripts/install-spider-devices.mjs
          node --check public/assets/spider-new-devices.js

      - name: Patch site pages
        run: node scripts/install-spider-devices.mjs

      - name: Commit Spider device additions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/index_phone.html public/assets/spider-new-devices.js public/assets/devices/spider-t777-elite-master-plus.jpg public/assets/devices/spider-t666-gold-plus-5g.jpg scripts/install-spider-devices.mjs .github/workflows/install-spider-devices.yml
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Add new Spider receiver devices"
            git push
          else
            echo "No changes to commit."
          fi
