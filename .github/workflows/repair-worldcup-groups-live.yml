name: Repair World Cup 2026 groups live data

on:
  workflow_dispatch:
  schedule:
    # Runs between the existing updater minutes to avoid push collisions.
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

concurrency:
  group: worldcup-groups-live-repair
  cancel-in-progress: true

jobs:
  repair-worldcup-groups:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repair World Cup groups, standings, and cache
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORLD_CUP_REPAIR_FULL_RANGE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          node scripts/install-worldcup-cache-headers.mjs
          node scripts/install-worldcup-browser-fix.mjs
          node scripts/repair-worldcup-groups-live.mjs

      - name: Commit repaired World Cup data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/worldcup-2026 public/_headers public/index.html)" ]; then
            git add public/worldcup-2026 public/_headers public/index.html
            git commit -m "Repair World Cup 2026 groups live data"
            git push
          else
            echo "No World Cup group repair changes to commit."
          fi
